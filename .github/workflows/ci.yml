name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14
      - name: Install verification tools
        run: |
          brew install coreutils gitleaks
          if ! command -v trash >/dev/null; then brew install trash; fi
      - run: timeout 120 bun install --frozen-lockfile --ignore-scripts
      - run: timeout 60 bun run typecheck
      - run: timeout 120 bun test
      - run: timeout 20 bun run verify:mcp
      - run: timeout 60 bun audit
      - run: timeout 60 gitleaks git . --redact --no-banner --log-opts=--all
