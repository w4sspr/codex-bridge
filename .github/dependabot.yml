version: 2
updates:
  # One grouped PR per ecosystem per month. CI auto-merges them when green
  # (see .github/workflows/ci.yml); failures open an issue.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: monthly
    groups:
      # Majors get their own PR so a breaking one can't block the safe updates.
      minor-and-patch:
        patterns: ["*"]
        update-types: [minor, patch]
      major:
        patterns: ["*"]
        update-types: [major]
