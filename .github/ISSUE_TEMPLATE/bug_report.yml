name: Bug report
description: Report a reproducible bridge problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Please omit real transcripts, credentials, session IDs, private paths, and client details. For security issues, follow SECURITY.md.
  - type: textarea
    id: versions
    attributes:
      label: Versions
      description: macOS, Bun, Codex CLI, Claude Code, and codex-bridge versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps with invented session data.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error output
      render: text
